# Default values for lge-deployment.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
# Configure the tag based on your environment. The tags are usually generated by the pipelinee:
# - latest-integ
# - latest-test
# - latest
image: 
  repository: sogetilabsfrance.azurecr.io/lge-wavecare/wavecare-front
  # This sets the pull policy for images.
  # pullPolicy: Always
  tag: "latest-test"

# This sets the arguments passed to the container command.
# If you want to pass arguments to the container, remove the brackets then uncomment the `args` section and modify them if necessary.
args: []
  # - "start-dev"
  # - "--port=8080"
  # - "--host="

# This is to override the chart name. It can usually be left empty.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
# The service account may already exist, in that case, keep `create` to `false`.
# When creating a service account, make sure a role exist in the vault to reference it
# and give it read access to ***REMOVED***s.
serviceAccount:
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "lge-wavecare-test-sa"
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # Remember that the `targetPort` is the port on the container, while the `port` is the port exposed by the service.
  port: 4000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# You may use the annotations for setting up url rewrites, proxying headers, or more.
# Uncomment the relevant snippets and remove the `{}`.
# The default annotations are as follows:
#     cert-manager.io/cluster-issuer: "letsencrypt-innovation-factory-azure-dns" #Necessary for cert-manager auto certificate-creation
#     kubernetes.io/tls-acme: "true"
#     nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
#     nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
# Redeclaring any of these annotations will override them.
# TLS is used for certificate configuration. When setting it up, remove the `[]`
ingress:
  enabled: true
  #disableWhitelist: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/configuration-snippet: |
      # more_set_headers "X-Forwarded-For $proxy_protocol_addr";
      # more_set_headers "X-Forwarded-Proto $scheme";
      # more_set_headers "X-Forwarded-Host $host";
      # more_set_headers "Forwarded $proxy_add_forwarded";
  hosts:
    - host: test.wavecare-app.innovation-factory.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - ***REMOVED***Name: test.wavecare-app.innovation-factory.io-***REMOVED***
      hosts:
        - test.wavecare-app.innovation-factory.io
      

# Setup your application's resources here.
# m = milliCPU, 1000m = 1.
# A frontend application that only serves static resources may work with a small value (20m-50m).
# A backend application may need higher requests (100m or more).
# 
# When the CPU limit is reached, the pod is throttled, but when the memory limit is reached,
# the pod is killed, make sure to not set the memory limit too low.
# A CPU limit is not strictly necessary.
resources:
  requests:
    cpu: 100m
    memory: 500Mi
  limits:
    cpu: 250m
    memory: 2300Mi

# Use key-value pairs to define the deployment's environment variables.
env:
  NODE_ENV: test
  #PORT: 8501

# The ***REMOVED*** path defined on the top level is where ***REMOVED***s are queried from.
# It can be overridden for each variable.
# If the ***REMOVED*** key is different in the vault than how the environment variable should be named,
# you can define the `vaultKey` value separately, otherwise, it defaults to the `key` value.
***REMOVED***s:
  enabled: true
  roleName: wavecare-test-role
  ***REMOVED***Path: ***REMOVED***/data/lge/wavecare/test
  data:
  - key: POSTGRES_USER
  - key: POSTGRES_PASSWORD
  - key: DJANGO_SECRET_KEY
  - key: POSTGRES_HOST
  - key: POSTGRES_PORT
  - key: POSTGRES_NAME
  - key: API_URL
  - key: STRAPI_BASE_URL

# --- THIS SECTION IS FOR MORE COMPLEX CONFIGURATION --- #
# --- You may not need to edit it --- #

# This is for the ***REMOVED***es for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

#This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

