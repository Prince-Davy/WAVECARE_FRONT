apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: wavecare-front
  name: wavecare-front
  namespace: lge-wavecare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wavecare-front
  template:
    metadata:
      labels:
        app: wavecare-front
    spec:
      serviceAccountName: lge-wavecare-sa
      containers:
        - name: wavecare-front
          image: sogetilabsfrance.azurecr.io/lge-wavecare/wavecare-front:latest-integ
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_PASSWORD
              value: password
            - name: DB_VENDOR
              value: POSTGRES
            - name: DB_ADDR
              value: localhost
            - name: DB_DATABASE
              value: keycloak
            - name: DB_USER
              value: keycloak
            - name: DB_PASSWORD
              value: password
            - name: KEYCLOAK_USER
              value: admin
            - name: KEYCLOAK_PASSWORD
              value: admin
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
            - mountPath: /mnt/***REMOVED***s-store
              name: ***REMOVED***s-store-inline
              readOnly: true
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 200m
              memory: 600Mi
            requests:
              cpu: 200m
              memory: 600Mi
      volumes:
        - name: ***REMOVED***s-store-inline
          csi:
            driver: "***REMOVED***s-store.csi.k8s.io"
            readOnly: true
            volumeAttributes:
              ***REMOVED***ProviderClass: "***REMOVED***-provider-wavecare-integ"
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z localhost 5432; do echo waiting for postgres; sleep 2; done;']
