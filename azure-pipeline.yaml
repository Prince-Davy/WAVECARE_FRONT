# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker
trigger:
  tags:
    include:
    - '*'
  branches:
    include:
    - develop
    - main
    - release/*
resources:
  repositories:
    - repository: templates
      type: git
      endpoint: SogetiLabsFranceRepository
      name: LGE_Templates/LGE_Templates
      ref: wip-experimental-helm
pool: labs-pool
variables:
  - group: sonar_token
  - name: project_group
    value: 'wavecare'
  - name: project_name
    value: 'wavecare-front'
  - name: imageRepository
    value: lge-wavecare/wavecare-front
  - name: dockerfilePath
    value: $(Build.SourcesDirectory)/Dockerfile
  - name: kubernetesNamespaceInteg
    value: 'lge-wavecare-app'
  - name: kubernetesNamespaceTest
    value: 'lge-wavecare-test'
 # Include template variables
  -  template: templates-general/variables.yml@templates

  
extends:
  template: templates-general/azure-general-front-tpl.yml@templates
  parameters:
    DEPLOY_INTEG: true
    DEPLOY_TEST: true
    DEPLOY_PROD: false
    NO_DOXYGEN_FAIL: true
    NO_SECURITY_FAIL: true
    NO_SONAR_FAIL: true
    NO_QUALITY_FAIL: true
    SCAN_SQ: true
    # Include specific variables of Quality and Security
    SKIP_DOXYGEN: false
    SKIP_QUALITY: false
    SKIP_SECURITY: false
    SKIP_COMPODOC: false
