# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker
trigger:
  tags:
    include:
    - '*'
  branches:
    include:
    - '*'
resources:
  repositories:
    - repository: templates
      type: git
      endpoint: SogetiLabsFranceRepository
      name: LGE_Templates/LGE_Templates
      ref: wip-experimental-helm
pool: labs-pool
variables:
  - name: project_group
    value: 'wavecare'
  - name: project_name
    value: 'wavecare-front'
  - name: imageRepository
    value: lge-wavecare/wavecare-front
  - name: dockerfilePath
    value: $(Build.SourcesDirectory)/Dockerfile
  - name: kubernetesNamespaceInteg
    value: 'lge-wavecare'
  # - name: deploymentName
  #   value: 'wavecare'
  # - name: deploymentIntegName
  #   value: 'wavecare'
  # - name : kubernetesNamespace
  #   value : 'lge-wavecare'
  # - name : kubernetesIntegNamespace
  #   value : 'lge-wavecare'
  # - name : kubernetesSecret
  #   value : 'wavecare-config'
  # - name : kubernetesIntegSecret
  #   value : 'wavecare-config'
  # - name : kubernetesConfigMap #Création automatique du configmap
  #   value : 'integ-wavecare-auto-configmap'

 # Include specific variables of Quality and Security
  - name: SKIP_DOXYGEN
    value: false
  - name: SKIP_QUALITY
    value: false
  - name: SKIP_SECURITY
    value: false
 # Include template variables
  -  template: templates-general/variables.yml@templates

  
extends:
  template: templates-general/azure-general-front-tpl.yml@templates
  parameters:
    DEPLOY_INTEG: true
    DEPLOY_TEST: false
    DEPLOY_PROD: false
    NO_DOXYGEN_FAIL: true
    NO_SECURITY_FAIL: true
    NO_SONAR_FAIL: true
    NO_QUALITY_FAIL: true
    SCAN_SQ: true
