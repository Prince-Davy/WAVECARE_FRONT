# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker
trigger:
  tags:
    include:
    - '*'
  branches:
    include:
    - '*'
resources:
  repositories:
    - repository: templates
      type: git
#      endpoint: SogetiLabsFranceRepository
      name: LGE_Templates/LGE_Templates
      ref: wip-experimental-helm
pool: labs-pool
variables:
  - name: project_group
    value: 'wavecare'
  - name: project_name
    value: 'wavecare'
  - name: imageRepository
    value: lge-wavecare/wavecare
  - name: dockerfilePath
    value: $(Build.SourcesDirectory)/Dockerfile
  - name: deploymentName
    value: 'wavecare'
  - name: deploymentIntegName
    value: 'wavecare'
  - name : kubernetesNamespace
    value : 'lge-wavecare'
  - name: kubernetesNamespaceInteg
    value : 'lge-wavecare'
  - name : kubernetesSecret
    value : 'wavecare-config'
  - name : kubernetesIntegSecret
    value : 'wavecare-config'
  - name : kubernetesConfigMap #Création automatique du configmap
    value : 'integ-wavecare-auto-configmap'
 # Include template variables
  -  template: templates-general/variables.yml@templates
  - name: deployOnIntegNamespace
    value: $[or(eq(variables['Build.SourceBranchName'], 'develop'), eq(variables['Build.SourceBranchName'], 'develop_DEV1'))]
  
extends:
  template: templates-general/azure-general-python-tpl.yml@templates
  parameters:
    DEPLOY_INTEG: true
    DEPLOY_PROD: false
    NO_QUALITY_FAIL: true
    NO_DOXYGEN_FAIL: true
    SCAN_SQ: true
