## SonarQube configuration for Wavecare Front
## Consolidated and cleaned to avoid duplicate entries.

sonar.projectKey=Wavecare-front
sonar.projectName=Wavecare Front
sonar.projectVersion=1.16.0

## SonarQube server (base URL)
sonar.host.url=https://sonarqube.innovation-factory.io

## Authentication: provide a token in the SONAR_TOKEN environment variable
## Example (PowerShell): $env:SONAR_TOKEN = '...'
## Note: sonar.login removed to avoid conflicts; SONAR_TOKEN env var is used directly

## Sources and tests
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts

## Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,src/app/api/generated/**,src/app/api/model/**,src/app/api/api/**

## Coverage

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.coverage.exclusions=src/**/*.spec.ts,src/test.ts,src/main.ts,src/main.server.ts,src/server.ts,src/environments/**,src/app/api/model/**,src/app/api/api/**,**/*.module.ts
sonar.cpd.exclusions=src/app/api/model/**,src/app/api/api/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
AUTO GENERATED BY CONFLICT EXTENSION<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< develop
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPath=tsconfig.json

sonar.coverage.exclusions=src/**/*.spec.ts,src/test.ts,src/main.ts,src/main.server.ts,src/server.ts,src/environments/**,src/app/api/generated/**,src/app/api/model/**,src/app/api/api/**,**/*.module.ts

## CPD
sonar.cpd.exclusions=src/app/api/generated/**,src/app/api/model/**,src/app/api/api/**

## Quality Gate (disabled in CI to avoid pipeline failure on coverage thresholds)
## Set to true locally if you want to wait for Quality Gate status
sonar.qualitygate.wait=false
sonar.qualitygate.timeout=300