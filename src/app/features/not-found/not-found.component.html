<!-- not-found.component.html -->
<div class="not-found-container">
  <div class="content">
    <div class="logo">
      <img class="logo" alt="logo de l'application wavecare" src="assets/images/LogoWaveCare_SansTexte.png">
    </div>
    
    <div class="error-code">
      <span class="dot dot-left"></span>
      <span class="digit">4</span>
      <span class="dot dot-middle"></span>
      <span class="digit">0</span>
      <span class="dot dot-right"></span>
      <span class="digit">4</span>
    </div>
    
    <div class="message">
      <p>Nous rencontrons actuellement des problèmes techniques.</p>
      <p>Nos équipes travaillent activement à résoudre ce problème.</p>
      <p>Nous vous remercions de votre patience et vous prions de nous excuser pour la gêne occasionnée.</p>
    </div>
    
    <div class="action-button">
      <a (click)="goToHome()" class="button-primary">← Retour à l'accueil</a>
    </div>
    
    <div class="support-links">
      <a href="javascript:void(0);" class="report-link">Signaler le problème</a>
    </div>
  </div>
  
  <div class="corner-shape-top"></div>
  <div class="corner-shape-bottom"></div>
  <div class="corner-shape-left"></div>
</div>
