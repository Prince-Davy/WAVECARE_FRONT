<div class="table-container">
    <h2>Suivi des tickets</h2>
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
  
      <!-- Colonnes -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="id">Id</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.id }}</td>
      </ng-container>
  
      <ng-container matColumnDef="objet">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="category">Objet demandé</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.category }}</td>
      </ng-container>

      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="lastName">Nom</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="firstName">Prénom</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.firstName }}</td>
      </ng-container>

      <ng-container matColumnDef="mail">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="mail">Mail</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.mail }}</td>
      </ng-container>

      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="status">Statut</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.status }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="ticketCreationDate">Date et heure</th>
        <td mat-cell *matCellDef="let ticket">{{ ticket.creation | date:'dd/MM/yyyy - HH:mm' }}</td>
      </ng-container>
  
      <!-- Header & Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [length]="resultsLength" [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
  </div>
