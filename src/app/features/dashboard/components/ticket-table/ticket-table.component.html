<div class="table-container">
    <h2>Suivi des tickets</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
      <!-- Colonnes -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.id}} </td>
      </ng-container>
  
      <ng-container matColumnDef="objet">
        <th mat-header-cell *matHeaderCellDef> Objet demandé </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.objet}} </td>
      </ng-container>
  
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef> Nom </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.nom}} </td>
      </ng-container>
  
      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef> Prénom </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.prenom}} </td>
      </ng-container>
  
      <ng-container matColumnDef="mail">
        <th mat-header-cell *matHeaderCellDef> Mail </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.mail}} </td>
      </ng-container>
  
      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef> Statut </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.statut}} </td>
      </ng-container>
  
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Date et heure </th>
        <td mat-cell *matCellDef="let ticket"> {{ticket.date}} </td>
      </ng-container>
  
      <!-- Header & Row -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
  </div>
