<div class="navbar">
  <div class="brand">
    <a routerLink="" href="#">
      <img class="logo" [alt]="'feature.navigation.navbar-component.logo-alt' | translate" src="assets/images/LogoWaveCare.png">
    </a>
  </div>
  <span class="spacer-mini"></span>
  <a class="custom-tab-button" [routerLink]="PATH_TO_TICKETS_FOR_HTML" href="#">
    <span class="custom-tab-button-label">{{'feature.navigation.navbar-component.menu.ticket-management-dashboard' | translate}}</span>
    <span class="custom-tab-button-underline" [class]="router.url === PATH_TO_TICKETS_FOR_HTML ? 'pink' : 'transparent'"></span>
  </a>

  <a class="custom-tab-button" [routerLink]="PATH_TO_USERS_FOR_HTML" href="#">
    <span class="custom-tab-button-label">{{'feature.navigation.navbar-component.menu.user-management-dashboard' | translate}}</span>
    <span class="custom-tab-button-underline" [class]="router.url === PATH_TO_USERS_FOR_HTML ? 'pink' : 'transparent'"></span>
  </a>
  <span class="spacer"></span>
  <div class="account-actions">
    <div class="user-info">
      <mat-icon class="material-symbols-outlined">account_circle</mat-icon>
      <span>{{ authTokenService.getCompleteName() }}</span>
    </div>
    <button mat-raised-button class="logout-button" (click)="logout()">{{'feature.navigation.navbar-component.logout-button' | translate}}</button>
  </div>
</div>
