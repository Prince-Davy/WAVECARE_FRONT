<div class="auth-container">


  <img class="logo" alt="logo de l'application wavecare" src="assets/images/LogoWaveCare_SansTexte.png">

  <mat-card class="login-card">
    <h2 class="title">WaveCare</h2>
    <p class="subtitle">Je me connecte avec mon Email :</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <!-- Champ Email -->
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="username" required>
      </mat-form-field>

      <!-- Champ Mot de passe -->
      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div *ngIf="(loginForm.invalid && submitted)||(errorMessage.length>0)" class="global-error">
         {{'E-mail et/ou mot de passe invalide'}}
      </div>

      <!-- Bouton de soumission -->
      <button mat-raised-button color="primary" type="submit">
        CONNEXION
      </button>
    </form>

    <!-- Error message for scenario 1 -->
    <div *ngIf="errorMessage" class="error-message" role="alert" style="color: #d32f2f; margin-top: 10px;">
      {{ errorMessage }}
    </div>


    <a routerLink="/forgot-password" class="forgot-password" href="#">MOT DE PASSE OUBLIÉ ?</a>

    <div class="divider">
      <span></span>
      <p>OU</p>
      <span></span>
    </div>

    <p class="signin-alt">S’identifier avec :</p>
    <button class="psc-button" aria-label="Connexion avec Pro Santé Connect">
      <img src="assets/images/pro-sante-connect.png" class="psc-logo" alt="Connexion via Pro Santé Connect">
    </button>

    <p class="footer" (click)="goToAssistance()" (keydown.enter)="goToAssistance()">UN PROBLÈME ? JE M'ADRESSE À UN ADMINISTRATEUR</p>
  </mat-card>

  <!-- Lockout Modal (Scenario 2) -->
  <div *ngIf="isLockoutModalOpen" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lockoutTitle">
      <button class="close-btn" (click)="closeLockoutModal()" aria-label="Fermer">Fermer&nbsp;×</button>
      <h2 id="lockoutTitle">Accès bloqué</h2>
      <p>{{ lockoutMessage }}
        <a href="#" (click)="goToAssistance(); $event.preventDefault();" class="modal-link">
          Veuillez contacter votre administrateur
        </a>
      </p>
    </div>
  </div>
</div>
