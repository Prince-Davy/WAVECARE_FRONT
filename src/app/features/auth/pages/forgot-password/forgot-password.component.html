<div class="***REMOVED***-container">
  <img class="logo" alt="logo de l'application wavecare" src="assets/images/LogoWaveCare_SansTexte.png">

  <mat-card class="***REMOVED***-card">
    <p class="title">Demande de réinitialisation du mot de passe</p>
    <div class="message">
      <div *ngIf="resetRequestSuccess === true" class="success-message">
        ✅ Un email de réinitialisation a été envoyé.
      </div>
      <div *ngIf="resetRequestSuccess === false" class="error-message">
        ❌ Erreur lors de l'envoi. Veuillez réessayer.
      </div>
    </div>
    <p class="subtitle">Veuillez entrer votre adresse e-mail. Un e-mail vous sera envoyé avec un lien pour réinitialiser votre mot de passe</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <mat-form-field appearance="outline" class="email-field">
          <input matInput id="email" formControlName="email" type="email" placeholder="votre.email@example.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">L'email est requis</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Format d'email invalide</mat-error>
        </mat-form-field>
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        Valider
      </button>
    </form>
  </mat-card>
</div>
