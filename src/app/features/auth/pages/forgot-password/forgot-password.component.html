<div class="***REMOVED***-container">


  <img class="logo" alt="logo de l'application wavecare" src="assets/images/LogoWaveCare_SansTexte.png">

  <mat-card class="***REMOVED***-card">
    <h2 class="title">WaveCare</h2>
    <p class="subtitle">Demande de réinitialisation du mot de passe</p>
    <p class="subtitle"> Veuillez entrer votre adresse e-mail. Un e-mail vous sera envoyé avec un lien pour réinitialiser votre mot de passe</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <input matInput id="email" formControlName="email" type="email" placeholder="votre.email@example.com">
      </div>

      <button type="submit">Envoyer un lien de réinitialisation</button>
    </form>


  </mat-card>
</div>
